version: '3.8'

services:
  auth-service:
    volumes:
      - ./services/auth-service:/usr/src/app
      - /usr/src/app/node_modules
    command: pnpm run start:dev
    environment:
      - NODE_ENV=development

  user-service:
    volumes:
      - ./services/user-service:/usr/src/app
      - /usr/src/app/node_modules
    command: pnpm run start:dev
    environment:
      - NODE_ENV=development

  social-service:
    volumes:
      - ./services/social-service:/usr/src/app
      - /usr/src/app/node_modules
    command: pnpm run start:dev
    environment:
      - NODE_ENV=development

  market-service:
    volumes:
