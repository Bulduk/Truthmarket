    environment:
      - NODE_ENV=development

  oracle-service:
    volumes:
      - ./services/oracle-service:/usr/src/app
      - /usr/src/app/node_modules
    command: pnpm run start:dev
    environment:
      - NODE_ENV=development

  notification-service:
    volumes:
      - ./services/notification-service:/usr/src/app
      - /usr/src/app/node_modules
    command: pnpm run start:dev
    environment:
      - NODE_ENV=development

  analytics-service:
    volumes:
      - ./services/analytics-service:/usr/src/app
